# `aiperf plot` config for the trace sweep (runs/<run>/traces/rep*/c*).
# See docs/plotting.md.
#
# The sweep doesn't collect GPU telemetry, so AIPerf can't compute throughput
# per GPU, and the default config skips 3 of its 4 comparison charts. These
# charts use total output throughput instead. On one 8-GPU node, per GPU would
# be total / 8, so the shapes are the same.
visualization:
  # Charts when the path holds several runs (a whole sweep, or one repeat).
  multi_run_defaults:
    - ttft_vs_throughput
    - itl_vs_throughput
    - interactivity_vs_throughput
    - latency_vs_throughput_uncertainty

  # Charts when the path is one point (one c* folder).
  single_run_defaults:
    - ttft_over_time
    - latency_over_time
    - ttft_timeline

  multi_run_plots:
    # Throughput goes on x: AIPerf joins the points in x order, and throughput
    # rises with concurrency, so each line follows the sweep. With TTFT on x
    # (AIPerf's default), the line zigzags.
    ttft_vs_throughput:
      type: scatter_line
      x: {metric: output_token_throughput, stat: avg}
      y: {metric: time_to_first_token, stat: p90}
      labels: [concurrency]
      groups: [model]
      title: "p90 TTFT vs Output Throughput (labels = concurrency)"
    itl_vs_throughput:
      type: scatter_line
      x: {metric: output_token_throughput, stat: avg}
      y: {metric: inter_token_latency, stat: p50}
      labels: [concurrency]
      groups: [model]
      title: "p50 ITL vs Output Throughput (labels = concurrency)"
    # Lines join only the Pareto frontier; points below it are worse on both axes.
    interactivity_vs_throughput:
      type: pareto
      x: {metric: output_token_throughput_per_user, stat: avg}
      y: {metric: output_token_throughput, stat: avg}
      labels: [concurrency]
      groups: [model]
      title: "Output Throughput vs Tokens/s per User"
    # experiment_group is the run folder's name (c1, c2, ...), so this pools
    # the repeats of each concurrency into one mean with a 95% ellipse.
    latency_vs_throughput_uncertainty:
      type: latency_throughput_uncertainty
      x: {metric: request_latency, stat: avg}
      y: {metric: output_token_throughput, stat: avg}
      labels: [concurrency]
      groups: [experiment_group]
      ci_level: 0.95
      title: "Request Latency vs Output Throughput (95% ellipses)"

  single_run_plots:
    ttft_over_time:
      type: scatter
      x: request_number
      y: time_to_first_token
      title: "TTFT Per Request"
    latency_over_time:
      type: scatter_with_percentiles
      x: timestamp
      y: request_latency
      title: "Request Latency Over Time (rolling p50/p95/p99)"
    ttft_timeline:
      type: request_timeline
      x: request_start_ns
      y: time_to_first_token
      title: "Request Timeline: TTFT vs Generation"
